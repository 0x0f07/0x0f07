name: counter

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: counter-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build counter.svg
        run: |
          python3 - <<'PY'
          import re
          import sys
          import urllib.request

          USER = "0x0f07"
          req = urllib.request.Request(
              f"https://hits.sh/github.com/{USER}.svg",
              headers={"User-Agent": "Mozilla/5.0"},
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  svg = response.read().decode()
          except Exception as e:
              sys.exit(f"Failed to fetch counter: {e}")

          nums = re.findall(r">\s*([0-9][0-9,]*)\s*<", svg)
          if not nums:
              sys.exit("Could not find a count in the hits.sh response")

          n = int(nums[-1].replace(",", ""))

          out = f'''<svg xmlns="http://www.w3.org/2000/svg" width="704" height="46" viewBox="0 0 704 46">
          <rect x="0.5" y="0.5" width="703" height="45" rx="6" fill="#0d1117" stroke="#30363d"/>
          <g font-family="Courier New,Consolas,monospace" font-size="13" xml:space="preserve">
          <text x="18" y="28" fill="#8b949e">&gt; visits</text>
          <text x="104" y="28" fill="#c9d1d9">{n:07d}</text>
          <text x="184" y="28" fill="#c9d1d9">_<animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></text>
          </g>
          </svg>
          '''

          with open("counter.svg", "w") as f:
              f.write(out)

          print("count:", n)
          PY

      - name: Commit and push counter.svg
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add counter.svg

          if git diff --cached --quiet; then
            echo "No changes to counter.svg"
            exit 0
          fi

          git commit -m "update counter"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
